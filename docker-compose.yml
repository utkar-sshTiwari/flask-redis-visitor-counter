services:
  redis:
    image: redis:7.2-alpine
    container_name: visitor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: visitor-web
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLUSTER_NAME=docker-compose
    depends_on:
      - redis

volumes:
  redis_data:
